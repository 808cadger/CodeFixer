name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/analyzer.js
      - run: node --check src/app.js
      - run: node --check sw.js
      - run: node tests/analyzer.test.js
      - run: node benchmarks/run-benchmark.js
